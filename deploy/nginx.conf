# /etc/nginx/sites-available/planner  (VDS 185.68.21.222)
# Symlink: ln -s /etc/nginx/sites-available/planner /etc/nginx/sites-enabled/planner
#
# Источник истины — этот файл; на сервере лежит его копия.
# Схема: браузер → nginx (этот конфиг) → 127.0.0.1:8080 (frps-туннель) →
# frpc на ноуте → uvicorn в docker. Статика фронта — /var/www/planner,
# кладётся туда деплой-джобом из .github/workflows/deploy.yml.
#
# NOTE: на сервере в sites-enabled ещё включён устаревший сайт `dayplan`
# (root /var/www/dayplan/..., proxy на :8000) — он полностью перекрыт
# редиректом ниже и подлежит удалению.

server {
    if ($host = dailyplannerapp.ru) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name dailyplannerapp.ru www.dailyplannerapp.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dailyplannerapp.ru www.dailyplannerapp.ru;
    ssl_certificate /etc/letsencrypt/live/dailyplannerapp.ru-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dailyplannerapp.ru-0001/privkey.pem;

    root /var/www/planner;
    index index.html;

    location = /legal/feedback-consent.txt {
        return 301 /api/legal/feedback-consent;
    }
    location = /legal/user-agreement.txt {
        return 301 /api/legal/user-agreement;
    }
    location = /legal/personal-data-policy.txt {
        return 301 /api/legal/personal-data-policy;
    }

    # Метрики Prometheus — только для внутреннего скрейпа на ноуте,
    # наружу не отдаём (там латентности эндпоинтов и версии софта).
    location = /api/metrics {
        return 404;
    }

    # OAuth discovery lives at the origin root by specification, while the
    # authorization/token endpoints themselves remain under /api/oauth/*.
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:8080/.well-known/oauth-authorization-server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://127.0.0.1:8080/.well-known/oauth-protected-resource/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP authorization middleware derives this trailing-slash discovery URL
    # from the canonical resource identifier. Keep the former URL above as a
    # compatibility alias for clients that cached it before canonicalization.
    location = /.well-known/oauth-protected-resource/mcp/ {
        proxy_pass http://127.0.0.1:8080/.well-known/oauth-protected-resource/mcp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Canonical MCP URL. Handle the slash redirect at the TLS terminator so an
    # upstream ASGI redirect can never accidentally downgrade https to http.
    # 308 is required to preserve POST bodies used by Streamable HTTP clients.
    location = /mcp {
        return 308 https://dailyplannerapp.ru/mcp/;
    }

    # Streamable HTTP transport for remote MCP clients.
    location /mcp/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 30M;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8080/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Service worker — никогда не кешировать, иначе браузер держит старый SW
    location ~* (sw\.js|registerSW\.js|workbox-.+\.js)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # index.html — проверять обновление при каждом запросе
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
