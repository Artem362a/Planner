# /etc/nginx/snippets/security-headers.conf
# Подключается в server-блоке и в location'ах со своими add_header (иначе
# nginx не наследует эти заголовки в такие location — классический грабли).
#
# CSP подогнан под собранный Vite+React SPA:
#   - script-src 'self'  — в сборке нет inline-скриптов, всё /assets/* с origin
#   - style-src 'unsafe-inline' — приложение активно использует inline style={{}}
#   - img-src data: blob:  — аватары/favicon как data:, скриншоты как blob:
#   - connect-src 'self'   — API тот же origin (/api)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
